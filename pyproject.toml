[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnisonic"
version = "1.0.0"
description = "Accessible Windows desktop application for OmniVoice text-to-speech"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "Pates2004"}]
keywords = [
    "tts",
    "text-to-speech",
    "speech-synthesis",
    "zero-shot",
    "multilingual",
    "diffusion",
    "voice-cloning",
    "accessibility",
    "desktop",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",

    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",

    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=5.3.0",
    "accelerate",
    "pydub",
    "gradio",
    "tensorboardX",
    "webdataset",
    "numpy",
    "soundfile",
    "librosa",
]

[project.optional-dependencies]

desktop = [
    "wxPython>=4.2.2",
    "sounddevice>=0.5",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "pre-commit>=4.0",
]

tn = [
    "WeTextProcessing",   # zh/en text normalization (numbers, dates, currency)
    "num2words",           # integer-to-words fallback for other languages
]

eval = [
    "jiwer==3.1.0",       # WER
    "s3prl",               # Speech representation (HuBERT etc.)
    "funasr",              # ASR models
    "zhconv",              # Chinese character normalization
    "zhon",                # Chinese punctuation
    "unidecode",            # Unicode normalization
]

lora = [
    "peft>=0.20.0",       # LoRA fine-tuning support
]

[project.scripts]
omnisonic = "omnisonic.app:main"
omnivoice-infer = "omnivoice.cli.infer:main"
omnivoice-infer-batch = "omnivoice.cli.infer_batch:main"
omnivoice-demo = "omnivoice.cli.demo:main"
omnivoice-merge-lora = "omnivoice.cli.merge_lora:main"

[project.urls]
Homepage = "https://github.com/Pates2004/omnisonic"
Repository = "https://github.com/Pates2004/omnisonic"
"Bug Tracker" = "https://github.com/Pates2004/omnisonic/issues"
"Upstream Engine" = "https://github.com/k2-fsa/OmniVoice"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E402"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  "fix_*.py",
  "patch_*.py",
  "refactor*.py",
  "update_*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["env", "venv", ".git", ".launcher"]

[tool.hatch.build.targets.sdist]
include = ["omnivoice", "omnisonic", "langs", "wx_app.py", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["omnivoice", "omnisonic"]

[tool.hatch.build.targets.wheel.force-include]
"langs" = "omnisonic/langs"
